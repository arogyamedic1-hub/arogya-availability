<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex,nofollow">

  <title>Doctor Availability</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;

      background: linear-gradient(
        180deg,
        #eaf5f0 0%,
        #f7faf8 45%,
        #ffffff 100%
      );
    }

    .page {
      min-height: 100vh;
      padding: 30px 18px 45px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: #16865c;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      font-weight: bold;

      box-shadow:
        0 8px 24px rgba(22, 134, 92, 0.22);
    }

    .clinic-name {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 7px;
      color: #667085;
      font-size: 14px;
    }

    .card {
      width: 100%;
      background: white;
      border-radius: 26px;
      padding: 28px 22px;
      text-align: center;

      border: 1px solid rgba(0, 0, 0, 0.04);

      box-shadow:
        0 12px 35px rgba(16, 24, 40, 0.08);
    }

    .loading {
      padding: 35px 10px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 18px;

      border: 4px solid #dcebe4;
      border-top-color: #16865c;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status-icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 19px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 44px;
      font-weight: bold;
    }

    .status-title {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
    }

    .status-description {
      margin-top: 8px;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .time-card {
      margin-top: 22px;
      padding: 17px;
      border-radius: 17px;
      background: #f7faf8;
      border: 1px solid #e4ece8;
    }

    .time-label {
      color: #667085;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .time-value {
      font-size: 17px;
      font-weight: bold;
      color: #1f2937;
    }

    .message-card {
      margin-top: 18px;
      padding: 18px;
      border-radius: 17px;
      background: #f7faf8;
      color: #344054;
      font-size: 15px;
      line-height: 1.6;
    }

    .updated {
      margin-top: 18px;
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
    }

    .error-icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;
      border-radius: 50%;

      background: #fdecec;
      color: #c62828;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 36px;
      font-weight: bold;
    }

    .error-title {
      margin: 0 0 10px;
      font-size: 22px;
      color: #c62828;
    }

    .error-message {
      color: #667085;
      line-height: 1.6;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="page">

    <main class="container">

      <header class="header">

        <div class="logo">+</div>

        <h1
          id="clinicName"
          class="clinic-name"
        >
          Medical Clinic
        </h1>

        <div class="subtitle">
          Doctor Availability
        </div>

      </header>

      <section
        id="mainCard"
        class="card"
      >

        <div class="loading">

          <div class="spinner"></div>

          <div>
            Checking doctor availability...
          </div>

        </div>

      </section>

      <div
        id="updated"
        class="updated"
      ></div>

      <div class="footer">
        Availability information is provided by the clinic.
        <br>
        Please contact the clinic directly if you need confirmation.
      </div>

    </main>

  </div>

  <script>
   const SUPABASE_KEY =
  "sb_publishable_JNfFs5n8a_t92Sz4KtBXkQ_r6Cmtp-m";
    
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDateTime(value) {
      if (!value) {
        return "";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "en-LK",
        {
          timeZone: "Asia/Colombo",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          hour12: true
        }
      ).format(date);
    }

    function getStatusDetails(status) {
      switch (status) {
        case "available":
          return {
            title: "Doctor Available Now",
            symbol: "✓",
            color: "#16865C",
            background: "#E8F5EF"
          };

        case "arriving_soon":
          return {
            title: "Doctor Arriving Soon",
            symbol: "◷",
            color: "#B7791F",
            background: "#FFF8E5"
          };

        case "busy":
          return {
            title: "Doctor Is Busy",
            symbol: "●",
            color: "#C05621",
            background: "#FFF3E8"
          };

        case "closed":
          return {
            title: "Clinic Closed",
            symbol: "×",
            color: "#546E7A",
            background: "#EEF2F4"
          };

        case "not_available":
        default:
          return {
            title: "Doctor Not Available",
            symbol: "×",
            color: "#C62828",
            background: "#FDECEC"
          };
      }
    }

    function showError(title, message) {
      const mainCard =
        document.getElementById("mainCard");

      mainCard.innerHTML = `
        <div class="error-icon">
          !
        </div>

        <h2 class="error-title">
          ${escapeHtml(title)}
        </h2>

        <div class="error-message">
          ${escapeHtml(message)}
        </div>
      `;
    }

    async function loadAvailability() {
      const parameters =
        new URLSearchParams(
          window.location.search
        );

      const token =
        parameters.get("token")?.trim();

      if (!token) {
        showError(
          "Invalid QR",
          "This clinic QR code is incomplete or invalid."
        );

        return;
      }

      const uuidPattern =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

      if (!uuidPattern.test(token)) {
        showError(
          "Invalid QR",
          "This clinic QR code is not valid."
        );

        return;
      }

      try {
        const endpoint =
          `${SUPABASE_URL}/rest/v1/rpc/` +
          `get_public_doctor_availability`;

        const response =
          await fetch(
            endpoint,
            {
              method: "POST",

             headers: {
  "Content-Type": "application/json",
  "apikey": SUPABASE_KEY,
  "Authorization": `Bearer ${SUPABASE_KEY}`
},

              body: JSON.stringify({
                p_public_token: token
              })
            }
          );

        if (!response.ok) {
          throw new Error(
            `Request failed: ${response.status}`
          );
        }

        const data =
          await response.json();

        let record = null;

        if (Array.isArray(data)) {
          if (data.length > 0) {
            record = data[0];
          }
        } else if (
          data &&
          typeof data === "object"
        ) {
          record = data;
        }

        if (!record) {
          showError(
            "Clinic Not Found",
            "This QR code is no longer active. Please contact the clinic for a new QR."
          );

          return;
        }

        const clinicName =
          record.clinic_name ||
          "Medical Clinic";

        document.getElementById(
          "clinicName"
        ).textContent =
          clinicName;

        const status =
          record.status ||
          "not_available";

        const statusInfo =
          getStatusDetails(status);

        let timeSection = "";

        if (
          status === "arriving_soon" &&
          record.expected_arrival_at
        ) {
          timeSection = `
            <div class="time-card">

              <div class="time-label">
                Expected Arrival
              </div>

              <div class="time-value">
                ${
                  escapeHtml(
                    formatDateTime(
                      record.expected_arrival_at
                    )
                  )
                }
              </div>

            </div>
          `;
        }

        if (
          (
            status === "available" ||
            status === "busy"
          ) &&
          record.available_until
        ) {
          timeSection = `
            <div class="time-card">

              <div class="time-label">
                Available Until
              </div>

              <div class="time-value">
                ${
                  escapeHtml(
                    formatDateTime(
                      record.available_until
                    )
                  )
                }
              </div>

            </div>
          `;
        }

        const message =
          String(
            record.patient_message ||
            ""
          ).trim();

        const messageSection =
          message
            ? `
              <div class="message-card">
                ${escapeHtml(message)}
              </div>
            `
            : "";

        document.getElementById(
          "mainCard"
        ).innerHTML = `

          <div
            class="status-icon"
            style="
              color: ${statusInfo.color};
              background: ${statusInfo.background};
            "
          >
            ${statusInfo.symbol}
          </div>

          <h2
            class="status-title"
            style="
              color: ${statusInfo.color};
            "
          >
            ${escapeHtml(statusInfo.title)}
          </h2>

          <div class="status-description">
            Current clinic consultation status
          </div>

          ${timeSection}

          ${messageSection}
        `;

        if (record.updated_at) {
          document.getElementById(
            "updated"
          ).textContent =
            "Last updated " +
            formatDateTime(
              record.updated_at
            );
        }

      } catch (error) {
        console.error(error);

        showError(
          "Unable to Check Availability",
          "Doctor availability could not be loaded. Please try again."
        );
      }
    }

    loadAvailability();
  </script>

</body>
</html>
